# Banco de Preguntas Saber PRO - Taller 13
# Levantar todo:   docker compose up -d --build
# Ver estado:      docker ps
# Apagar todo:     docker compose down        (agrega -v para borrar también los datos de PostgreSQL)

networks:
  saberpro-net:
    driver: bridge

volumes:
  pgdata:

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: saberpro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - saberpro-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: saberpro-postgres
    environment:
      - POSTGRES_DB=saberpro
      - POSTGRES_USER=saberpro
      - POSTGRES_PASSWORD=saberpro
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - saberpro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saberpro -d saberpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  validation-service:
    build: ./validation-service
    container_name: saberpro-validation-service
    ports:
      - "8082:8082"
    networks:
      - saberpro-net

  question-service:
    build: ./question-service
    container_name: saberpro-question-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - VALIDATION_SERVICE_URL=http://validation-service:8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/saberpro
      - SPRING_DATASOURCE_USERNAME=saberpro
      - SPRING_DATASOURCE_PASSWORD=saberpro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      validation-service:
        condition: service_started
    networks:
      - saberpro-net

  lifecycle-service:
    build: ./lifecycle-service
    container_name: saberpro-lifecycle-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - saberpro-net
